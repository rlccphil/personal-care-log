    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --neutral: #e5e7eb;
        --accent: #365233;
        --accent-dark: #2b4029;
        --soft: #eaf3ea;
        --warn: #b45309;
        --warn-soft: #fef3c7;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      html, body {
        margin: 0; padding: 0;
        background: linear-gradient(160deg, #eef5ee 0%, var(--bg) 45%, #eef6f0 100%);
        font-family: 'Inter', "Segoe UI", Avenir Next, Arial, sans-serif;
        color: var(--text);
      }
      .topbar {
        background: var(--accent);
        color: #fff;
        padding: 18px 18px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
      }
      .logoBox {
        width: 220px; height: 84px;
        background: #fff; border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        padding: 10px; flex: 0 0 auto;
      }
      .logoBox img { max-width: 100%; max-height: 100%; display: block; }
      .topbarText { min-width: 0; }
      .topbar h1 { margin: 0; font-size: 19px; font-weight: 800; }
      .topbar p { margin: 3px 0 0; font-size: 12.5px; opacity: .88; }
      .tabs {
        display: flex; gap: 6px;
        background: var(--surface);
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 5;
      }
      .tab-btn {
        flex: 1; padding: 9px 6px; border: none; border-radius: 10px;
        background: transparent; color: var(--muted); font-weight: 700;
        font-size: 12.5px; cursor: pointer;
      }
      .tab-btn.active { background: var(--soft); color: var(--accent-dark); }
      main { max-width: 720px; margin: 0 auto; padding: 14px 12px 40px; }
      .view { display: none; }
      .view.active { display: block; }
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; padding: 14px; margin-bottom: 12px;
      }
      label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 12px 0 5px; }
      label:first-child { margin-top: 0; }
      input[type="text"], input[type="date"], select, textarea {
        width: 100%; padding: 9px 10px; border: 1px solid var(--border);
        border-radius: 9px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
      }
      textarea { min-height: 72px; resize: vertical; }
      .help-types { display: flex; flex-wrap: wrap; gap: 8px; }
      .ac-wrap { position: relative; }
      .ac-list {
        display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
        background: #fff; border: 1px solid var(--border); border-radius: 10px;
        max-height: 190px; overflow-y: auto; z-index: 20;
        box-shadow: 0 8px 20px rgba(0,0,0,.08);
      }
      .ac-list.open { display: block; }
      .ac-item { padding: 9px 12px; font-size: 13.5px; cursor: pointer; }
      .ac-item:active, .ac-item.active { background: var(--soft); }
      .ac-item + .ac-item { border-top: 1px solid var(--neutral); }
      .ac-empty { padding: 9px 12px; font-size: 12.5px; color: var(--muted); }
      .chk {
        display: flex; align-items: center; gap: 6px;
        border: 1px solid var(--border); border-radius: 999px;
        padding: 6px 12px; font-size: 12.5px; cursor: pointer; background: #fff;
      }
      .chk input { margin: 0; }
      .chk.checked { background: var(--soft); border-color: var(--accent); color: var(--accent-dark); font-weight: 700; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .row2 > div { min-width: 0; }
      .row2 input[type="date"], .row2 select { width: 100%; min-width: 0; }
      input[type="date"] {
        -webkit-appearance: none;
        appearance: none;
        max-width: 100%;
      }
      .row2 { align-items: start; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 11px 16px; border-radius: 10px; border: none; font-weight: 700;
        font-size: 14px; cursor: pointer;
      }
      .btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 14px; }
      .btn-primary:active { background: var(--accent-dark); }
      .btn-secondary { background: var(--neutral); color: var(--text); }
      .btn-danger { background: #fee2e2; color: var(--danger); }
      .btn-small { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
      .btn-row { display: flex; gap: 8px; margin-top: 10px; }
      .confidential-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
      .confidential-row input { margin: 0; }
      .confidential-row span { font-size: 13px; color: var(--muted); }
      .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
      .filters input, .filters select { font-size: 13px; padding: 8px 9px; }
      .entry {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; padding: 12px; margin-bottom: 10px;
      }
      .entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
      .entry-people { font-weight: 800; font-size: 14.5px; }
      .entry-people .muted-to { font-weight: 600; color: var(--muted); }
      .entry-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
      .badges { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0; }
      .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--accent-dark); }
      .badge.status-open { background: #dbeafe; color: #1e40af; }
      .badge.status-followup { background: var(--warn-soft); color: var(--warn); }
      .badge.status-closed { background: var(--neutral); color: var(--muted); }
      .badge.lock { background: #fee2e2; color: var(--danger); }
      .entry-topic { font-size: 13px; font-weight: 600; color: var(--text); margin: 2px 0; }
      .entry-body { display: none; margin-top: 8px; font-size: 13.5px; line-height: 1.5; }
      .entry-body.open { display: block; }
      .entry-body .label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-top: 8px; }
      .entry-body .label:first-child { margin-top: 0; }
      .empty-state { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13.5px; }
      #toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px;
        font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #loading {
        display: none; position: fixed; inset: 0; background: rgba(255,255,255,.7);
        align-items: center; justify-content: center; font-weight: 700; color: var(--accent-dark); z-index: 40;
      }
      #loading.show { display: flex; }
      .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
      .kpi { background: var(--soft); border-radius: 12px; padding: 12px; }
      .kpi .num { font-size: 24px; font-weight: 900; color: var(--accent-dark); }
      .kpi .lbl { font-size: 11.5px; color: var(--muted); font-weight: 700; }
      .bar-row { margin-bottom: 8px; }
      .bar-row .bar-label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
      .bar-track { background: var(--neutral); border-radius: 999px; height: 8px; overflow: hidden; }
      .bar-fill { background: var(--accent); height: 100%; }
      .section-title { font-size: 13px; font-weight: 800; color: var(--accent-dark); margin: 16px 0 8px; }
      .notice { font-size: 12.5px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 9px 11px; margin-bottom: 12px; }
    </style>

      <div class="topbarText">
        <h1 id="appTitle">Personal Care Log</h1>
        <p>Mentoring · Coaching · Counseling · Discipling · Spiritual Direction</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-view="new" onclick="setView('new')">New Entry</button>
      <button class="tab-btn" data-view="log" onclick="setView('log')">Log</button>
      <button class="tab-btn" data-view="stats" onclick="setView('stats')">Stats</button>
    </div>

    <main>
      <!-- NEW ENTRY -->
      <section id="viewNew" class="view active">
        <div class="card">
          <div id="editingNotice" style="display:none;" class="notice">Editing an existing entry. <a href="#" onclick="cancelEdit();return false;" style="color:var(--warn);font-weight:700;">Cancel edit</a></div>

          <label>Helper (who gave the help)</label>
          <div class="ac-wrap">
            <input type="text" id="helperInput" placeholder="Type a name — new names are OK" autocomplete="off">
            <div class="ac-list" id="helperSuggestions"></div>
          </div>

          <label>Person Helped</label>
          <div class="ac-wrap">
            <input type="text" id="personInput" placeholder="Type a name — new names are OK" autocomplete="off">
            <div class="ac-list" id="personSuggestions"></div>
          </div>

          <div class="row2">
            <div>
              <label>Date of Activity</label>
              <input type="date" id="activityDate">
            </div>
            <div>
              <label>Status</label>
              <select id="statusSelect"></select>
            </div>
          </div>

          <label>Type of Help</label>
          <select id="helpTypeSelect"></select>

          <label>Topic / Focus</label>
          <input type="text" id="topicInput" placeholder="e.g. Career decision, marriage conflict, prayer for healing">

          <label>Summary — what happened</label>
          <textarea id="summaryInput" placeholder="Brief summary of the conversation or session"></textarea>

          <label>Follow-Through / Next Steps</label>
          <textarea id="followThroughInput" placeholder="What's the plan going forward?"></textarea>

          <label>Follow-up Date (optional)</label>
          <input type="date" id="followUpDate">

          <div class="confidential-row">
            <input type="checkbox" id="confidentialCheck">
            <span>Mark as confidential (sensitive/counseling — hide details in the shared log list)</span>
          </div>

          <button class="btn btn-primary" id="saveBtn" onclick="saveEntry()">Save Entry</button>
        </div>
      </section>

      <!-- LOG -->
      <section id="viewLog" class="view">
        <div class="card">
          <div class="filters">
            <input type="text" id="filterPerson" placeholder="Person helped">
            <input type="text" id="filterHelper" placeholder="Helper">
            <select id="filterType"><option value="">Any type</option></select>
            <select id="filterStatus"><option value="">Any status</option></select>
            <input type="date" id="filterFrom">
            <input type="date" id="filterTo">
          </div>
          <div class="btn-row">
            <button class="btn btn-secondary btn-small" onclick="loadEntries()">Search</button>
            <button class="btn btn-secondary btn-small" onclick="clearFilters()">Clear</button>
          </div>
        </div>
        <div id="entryList"></div>
      </section>

      <!-- STATS -->
      <section id="viewStats" class="view">
        <div class="card">
          <div class="row2">
            <div>
              <label>From</label>
              <input type="date" id="statsFrom">
            </div>
            <div>
              <label>To</label>
              <input type="date" id="statsTo">
            </div>
          </div>
          <button class="btn btn-secondary btn-small" style="margin-top:10px;" onclick="loadStats()">Update</button>
        </div>
        <div id="statsOutput"></div>
      </section>
    </main>

    <div id="toast"></div>
    <div id="loading">Loading…</div>

    <script>
      // ===== SERVER BRIDGE (JSONP so this also works hosted standalone) =====
      var API_BASE_URL_ = (window.RLCC_API_URL || '').trim();
      var jsonpCounter_ = 0;
      var usingGasRunner_ = (typeof google !== 'undefined' && google.script && google.script.run);

      function callServer(fnName) {
        var args = Array.prototype.slice.call(arguments, 1);

        if (usingGasRunner_) {
          return new Promise(function(resolve, reject) {
            var runner = google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(function(err) {
                reject(new Error(err && err.message ? err.message : String(err || 'Unknown error')));
              });
            runner[fnName].apply(runner, args);
          });
        }

        return new Promise(function(resolve, reject) {
          if (!API_BASE_URL_ || API_BASE_URL_.indexOf('PASTE_YOUR') === 0) {
            reject(new Error('API URL is not configured. Set window.RLCC_API_URL at the top of index.html.'));
            return;
          }
          jsonpCounter_ += 1;
          var callbackName = '__careLogCb' + jsonpCounter_ + '_' + Date.now();
          var script = document.createElement('script');
          var timeoutId;

          function cleanup() {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            clearTimeout(timeoutId);
          }

          window[callbackName] = function(result) {
            cleanup();
            if (result && result.ok) resolve(result.data);
            else reject(new Error((result && result.error) || 'Server error'));
          };

          timeoutId = setTimeout(function() {
            cleanup();
            reject(new Error('Request timed out. Please try again.'));
          }, 60000);

          var url = API_BASE_URL_ +
            (API_BASE_URL_.indexOf('?') === -1 ? '?' : '&') +
            'api=1&fn=' + encodeURIComponent(fnName) +
            '&args=' + encodeURIComponent(JSON.stringify(args)) +
            '&callback=' + encodeURIComponent(callbackName);

          script.src = url;
          script.onerror = function() {
            cleanup();
            reject(new Error('Could not reach the server. Check your connection or the API URL.'));
          };
          document.body.appendChild(script);
        });
      }

      // ===== STATE =====
      var state = {
        bootstrap: null,
        editingEntryId: null,
        view: 'new'
      };

      function el(id) { return document.getElementById(id); }

      function setLoading(active) {
        el('loading').classList.toggle('show', !!active);
      }

      function showToast(message, isError) {
        var t = el('toast');
        t.textContent = message;
        t.style.background = isError ? '#991b1b' : '#111827';
        t.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(function() { t.classList.remove('show'); }, 2400);
      }

      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function setView(name) {
        state.view = name;
        ['new', 'log', 'stats'].forEach(function(v) {
          el('view' + v.charAt(0).toUpperCase() + v.slice(1)).classList.toggle('active', v === name);
        });
        document.querySelectorAll('.tab-btn').forEach(function(b) {
          b.classList.toggle('active', b.getAttribute('data-view') === name);
        });
        if (name === 'log' && !el('entryList').dataset.loaded) loadEntries();
        if (name === 'stats' && !el('statsOutput').dataset.loaded) loadStats();
      }

      // ===== BOOTSTRAP / FORM SETUP =====

      function setupAutocomplete(inputEl, listEl, getRoster) {
        function render(items) {
          if (!items.length) { listEl.innerHTML = ''; listEl.classList.remove('open'); return; }
          listEl.innerHTML = items.map(function(p) {
            return '<div class="ac-item" data-name="' + escHtml(p.name) + '">' + escHtml(p.name) +
              (p.className ? ' <span style="color:var(--muted);font-size:11.5px;">(' + escHtml(p.className) + ')</span>' : '') +
              '</div>';
          }).join('');
          listEl.classList.add('open');
        }

        inputEl.addEventListener('input', function() {
          var q = inputEl.value.trim().toLowerCase();
          var roster = getRoster();
          var matches = !q ? roster.slice(0, 8) : roster.filter(function(p) {
            return p.name.toLowerCase().indexOf(q) !== -1;
          }).slice(0, 8);
          render(matches);
        });
        inputEl.addEventListener('focus', function() {
          inputEl.dispatchEvent(new Event('input'));
        });
        listEl.addEventListener('mousedown', function(ev) {
          var item = ev.target.closest('.ac-item');
          if (!item) return;
          ev.preventDefault();
          inputEl.value = item.getAttribute('data-name');
          listEl.classList.remove('open');
        });
        document.addEventListener('click', function(ev) {
          if (ev.target !== inputEl && !listEl.contains(ev.target)) listEl.classList.remove('open');
        });
      }

      function getPersonValue(which) {
        return (which === 'helper' ? el('helperInput') : el('personInput')).value.trim();
      }

      function renderHelpTypeOptions(types) {
        populateSelectOptions(el('helpTypeSelect'), types, '— Select —');
      }

      function getSelectedHelpType() {
        var v = el('helpTypeSelect').value;
        return v ? [v] : [];
      }

      function setSelectedHelpType(values) {
        el('helpTypeSelect').value = (values && values[0]) || '';
      }

      function populateSelectOptions(selectEl, values, includeBlankLabel) {
        selectEl.innerHTML = '';
        if (includeBlankLabel) {
          var blank = document.createElement('option');
          blank.value = ''; blank.textContent = includeBlankLabel;
          selectEl.appendChild(blank);
        }
        values.forEach(function(v) {
          var opt = document.createElement('option');
          opt.value = v; opt.textContent = v;
          selectEl.appendChild(opt);
        });
      }

      async function loadBootstrap() {
        setLoading(true);
        try {
          var data = await callServer('apiGetBootstrap');
          state.bootstrap = data;
          el('appTitle').textContent = 'Personal Care Log';
          document.title = 'Personal Care Log';

          setupAutocomplete(el('helperInput'), el('helperSuggestions'), function() { return state.bootstrap.roster || []; });
          setupAutocomplete(el('personInput'), el('personSuggestions'), function() { return state.bootstrap.roster || []; });
          renderHelpTypeOptions(data.helpTypes || []);
          populateSelectOptions(el('statusSelect'), data.statusOptions || []);
          populateSelectOptions(el('filterType'), data.helpTypes || [], 'Any type');
          populateSelectOptions(el('filterStatus'), data.statusOptions || [], 'Any status');

          el('activityDate').value = data.todayIso || '';

          if (!data.rosterAvailable) {
            var notice = document.createElement('div');
            notice.className = 'notice';
            notice.textContent = 'Member list unavailable (' + (data.rosterNote || 'not configured') + '). Type any name — it will be saved as entered.';
            el('viewNew').querySelector('.card').insertBefore(notice, el('viewNew').querySelector('.card').firstChild);
          }
        } catch (err) {
          showToast('Could not load app data: ' + err.message, true);
        } finally {
          setLoading(false);
        }
      }

      // ===== SAVE / EDIT =====

      function resetForm() {
        state.editingEntryId = null;
        el('editingNotice').style.display = 'none';
        el('saveBtn').textContent = 'Save Entry';
        el('helperInput').value = '';
        el('personInput').value = '';
        el('activityDate').value = state.bootstrap ? state.bootstrap.todayIso : '';
        setSelectedHelpType([]);
        el('topicInput').value = '';
        el('summaryInput').value = '';
        el('followThroughInput').value = '';
        el('followUpDate').value = '';
        el('statusSelect').value = (state.bootstrap && state.bootstrap.statusOptions[0]) || 'Open';
        el('confidentialCheck').checked = false;
      }

      function cancelEdit() { resetForm(); }

      function buildEntryPayload() {
        return {
          helper: getPersonValue('helper'),
          personHelped: getPersonValue('person'),
          activityDate: el('activityDate').value,
          helpTypes: getSelectedHelpType(),
          topic: el('topicInput').value.trim(),
          summary: el('summaryInput').value.trim(),
          followThrough: el('followThroughInput').value.trim(),
          followUpDate: el('followUpDate').value,
          status: el('statusSelect').value,
          confidential: el('confidentialCheck').checked
        };
      }

      async function saveEntry() {
        var payload = buildEntryPayload();
        if (!payload.helper) { showToast('Please select or enter the Helper', true); return; }
        if (!payload.personHelped) { showToast('Please select or enter the Person Helped', true); return; }
        if (!payload.activityDate) { showToast('Please choose the activity date', true); return; }
        if (payload.helpTypes.length === 0) { showToast('Please choose a type of help', true); return; }
        if (!payload.summary) { showToast('Please add a short summary', true); return; }

        el('saveBtn').disabled = true;
        setLoading(true);
        try {
          if (state.editingEntryId) {
            await callServer('apiUpdateCareEntry', state.editingEntryId, payload);
            showToast('Entry updated');
          } else {
            await callServer('apiSaveCareEntry', payload);
            showToast('Entry saved');
          }
          resetForm();
          el('entryList').dataset.loaded = '';
          el('statsOutput').dataset.loaded = '';
        } catch (err) {
          showToast('Save failed: ' + err.message, true);
        } finally {
          el('saveBtn').disabled = false;
          setLoading(false);
        }
      }

      function beginEdit(entry) {
        state.editingEntryId = entry.entryId;
        el('editingNotice').style.display = 'block';
        el('saveBtn').textContent = 'Update Entry';

        el('helperInput').value = entry.helper || '';
        el('personInput').value = entry.personHelped || '';

        el('activityDate').value = entry.activityDate;
        setSelectedHelpType(entry.helpTypes || []);
        el('topicInput').value = entry.topic || '';
        el('summaryInput').value = entry.summary || '';
        el('followThroughInput').value = entry.followThrough || '';
        el('followUpDate').value = entry.followUpDate || '';
        el('statusSelect').value = entry.status || '';
        el('confidentialCheck').checked = !!entry.confidential;

        setView('new');
        window.scrollTo(0, 0);
      }

      async function deleteEntry(entryId) {
        if (!window.confirm('Delete this entry? This cannot be undone.')) return;
        setLoading(true);
        try {
          await callServer('apiDeleteCareEntry', entryId);
          showToast('Entry deleted');
          loadEntries();
          el('statsOutput').dataset.loaded = '';
        } catch (err) {
          showToast('Delete failed: ' + err.message, true);
        } finally {
          setLoading(false);
        }
      }

      // ===== LOG / FILTER =====

      function clearFilters() {
        el('filterPerson').value = '';
        el('filterHelper').value = '';
        el('filterType').value = '';
        el('filterStatus').value = '';
        el('filterFrom').value = '';
        el('filterTo').value = '';
        loadEntries();
      }

      function statusBadgeClass(status) {
        var s = (status || '').toLowerCase();
        if (s.indexOf('follow') !== -1) return 'status-followup';
        if (s.indexOf('closed') !== -1) return 'status-closed';
        return 'status-open';
      }

      function renderEntries(entries) {
        var list = el('entryList');
        list.innerHTML = '';
        if (!entries.length) {
          list.innerHTML = '<div class="empty-state">No entries match yet.</div>';
          return;
        }
        entries.forEach(function(e) {
          var card = document.createElement('div');
          card.className = 'entry';

          var badgesHtml = e.helpTypes.map(function(t) { return '<span class="badge">' + escHtml(t) + '</span>'; }).join('') +
            '<span class="badge ' + statusBadgeClass(e.status) + '">' + escHtml(e.status) + '</span>' +
            (e.confidential ? '<span class="badge lock">🔒 Confidential</span>' : '');

          var detailHtml = e.confidential
            ? '<div class="label">Details</div><div>Confidential — open in the spreadsheet or edit to view.</div>'
            : (
              (e.topic ? '<div class="label">Topic</div><div>' + escHtml(e.topic) + '</div>' : '') +
              '<div class="label">Summary</div><div>' + escHtml(e.summary).replace(/\n/g, '<br>') + '</div>' +
              (e.followThrough ? '<div class="label">Follow-Through</div><div>' + escHtml(e.followThrough).replace(/\n/g, '<br>') + '</div>' : '') +
              (e.followUpDate ? '<div class="label">Follow-up Date</div><div>' + escHtml(e.followUpDate) + '</div>' : '')
            );

          card.innerHTML =
            '<div class="entry-top">' +
              '<div class="entry-people">' + escHtml(e.helper) + ' <span class="muted-to">→</span> ' + escHtml(e.personHelped) + '</div>' +
              '<div class="entry-date">' + escHtml(e.activityDate) + '</div>' +
            '</div>' +
            '<div class="badges">' + badgesHtml + '</div>' +
            (e.topic && !e.confidential ? '<div class="entry-topic">' + escHtml(e.topic) + '</div>' : '') +
            '<div class="entry-body" data-body></div>';

          var body = card.querySelector('[data-body]');
          body.innerHTML = detailHtml +
            '<div class="btn-row">' +
              '<button class="btn btn-secondary btn-small" data-edit>Edit</button>' +
              '<button class="btn btn-danger btn-small" data-delete>Delete</button>' +
            '</div>';

          card.querySelector('.entry-top').addEventListener('click', function() {
            body.classList.toggle('open');
          });
          body.querySelector('[data-edit]').addEventListener('click', function(ev) {
            ev.stopPropagation();
            beginEdit(e);
          });
          body.querySelector('[data-delete]').addEventListener('click', function(ev) {
            ev.stopPropagation();
            deleteEntry(e.entryId);
          });

          list.appendChild(card);
        });
      }

      async function loadEntries() {
        setLoading(true);
        try {
          var filters = {
            personHelped: el('filterPerson').value.trim(),
            helper: el('filterHelper').value.trim(),
            helpType: el('filterType').value,
            status: el('filterStatus').value,
            fromIso: el('filterFrom').value,
            toIso: el('filterTo').value
          };
          var entries = await callServer('apiGetCareEntries', filters);
          renderEntries(entries);
          el('entryList').dataset.loaded = '1';
        } catch (err) {
          showToast('Could not load entries: ' + err.message, true);
        } finally {
          setLoading(false);
        }
      }

      // ===== STATS =====

      function renderStats(stats) {
        var out = el('statsOutput');
        var typeEntries = Object.keys(stats.byType).map(function(k) { return { label: k, count: stats.byType[k] }; })
          .sort(function(a, b) { return b.count - a.count; });
        var maxTypeCount = typeEntries.reduce(function(m, t) { return Math.max(m, t.count); }, 1);

        var html = '<div class="card">' +
          '<div class="kpi-grid">' +
            '<div class="kpi"><div class="num">' + stats.totalEntries + '</div><div class="lbl">Total Sessions Logged</div></div>' +
            '<div class="kpi"><div class="num">' + stats.uniquePeopleHelped + '</div><div class="lbl">People Helped</div></div>' +
          '</div>' +
          '<div class="section-title">By Type of Help</div>' +
          typeEntries.map(function(t) {
            var pct = Math.round((t.count / maxTypeCount) * 100);
            return '<div class="bar-row"><div class="bar-label"><span>' + escHtml(t.label) + '</span><span>' + t.count + '</span></div>' +
              '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div></div>';
          }).join('') +
          (typeEntries.length ? '' : '<div class="empty-state">No data yet</div>') +
          '<div class="section-title">By Status</div>' +
          Object.keys(stats.byStatus).map(function(k) {
            return '<span class="badge ' + statusBadgeClass(k) + '" style="margin-right:6px;">' + escHtml(k) + ': ' + stats.byStatus[k] + '</span>';
          }).join('') +
          '<div class="section-title">Most Active Helpers</div>' +
          (stats.topHelpers.length ? stats.topHelpers.map(function(h) {
            return '<div class="bar-row"><div class="bar-label"><span>' + escHtml(h.name) + '</span><span>' + h.count + '</span></div></div>';
          }).join('') : '<div class="empty-state">No data yet</div>') +
        '</div>';

        out.innerHTML = html;
      }

      async function loadStats() {
        setLoading(true);
        try {
          var stats = await callServer('apiGetDashboardStats', el('statsFrom').value, el('statsTo').value);
          renderStats(stats);
          el('statsOutput').dataset.loaded = '1';
        } catch (err) {
          showToast('Could not load stats: ' + err.message, true);
        } finally {
          setLoading(false);
        }
      }

      // ===== INIT =====
      document.addEventListener('DOMContentLoaded', function() {
        loadBootstrap();
      });
    </script>
  </body>
</html>
